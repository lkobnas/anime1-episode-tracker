<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8"> 
<head>
    <title>Last Watched Episode</title>
    <style>
       body {
            font-family: Arial, sans-serif;
            padding: 10px;
            width: 260px;
        }
        h2 {
            font-size: 16px;
            margin-bottom: 5px;
        }
        p {
            margin: 5px 0;
        }
        .clear-button {
            margin-top: 15px;
            padding: 5px 10px;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .clear-button:hover {
            background-color: #cc0000;
        }
        .settings-group {
            margin-top: 10px;
            font-size: 12px;
        }
        .settings-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            gap: 6px;
        }
        .settings-group input[type="number"] {
            width: 70px;
            padding: 2px 4px;
            box-sizing: border-box;
        }
        .settings-title {
            margin-top: 12px;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h2>你上次睇緊</h2>
    <p><strong>番名:</strong> <span id="animeTitle">Loading...</span></p>
    <p><strong>集數:</strong> <span id="episodeNumber">Loading...</span></p>
    <p><strong>剩餘時間:</strong> <span id="remainingTime">Loading...</span></p>
    <div style="margin-top: 15px;">
        <label>
            <input type="checkbox" id="autoPlay"> 自動播放
        </label>
    </div>
    <div style="margin-top: 5px;">
        <label>
            <input type="checkbox" id="autoNextEpisode">
            剩餘時間少於 <span id="autoNextThresholdText">1:30</span> 時, 按暫停自動播放下一集
        </label>
    </div>
    <div class="settings-title">進階設定 (秒)</div>
    <div class="settings-group">
        <label>
            自動下一集threshold
            <input type="number" id="autoNextThreshold" min="10" max="600" step="1" />
        </label>
        <label>
            方向鍵快進/後退秒數
            <input type="number" id="skipSeconds" min="1" max="30" step="1" />
        </label>
        <label>
            按(NumPad .)快進秒數, 用於skip OP
            <input type="number" id="skipOpeningSeconds" min="5" max="300" step="1" />
        </label>
    </div>
    <button id="clearData" class="clear-button">清除記錄</button>
    <script src="popup.js"></script>
</body>
</html>
